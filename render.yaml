previewsEnabled: false

services:
  # 1. The Backend Web Service (runs the Dockerfile)
  - type: web
    name: outbox-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Automatically connect the Database and Redis created below
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: outbox-redis
          property: connectionString
          
      # Auto-generate a secure random secret for JWT
      - key: JWT_SECRET
        generateValue: true
        
      # Hardcoded configurations
      - key: WORKER_MODE
        value: all
      - key: ES_ENABLED
        value: "false"
      - key: ETHEREAL
        value: "false"
      - key: SMTP_FROM
        value: "ReachInbox <arungautam0041@gmail.com>"
        
      # Placeholders - You will paste these directly into the Render Dashboard later securely!
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # 2. Managed Redis Cache
  - type: redis
    name: outbox-redis
    ipAllowList: [] # [] ensures it is secure and only accessible internally by your backend

# 3. Managed PostgreSQL Database
databases:
  - name: outbox-postgres
    databaseName: reachinbox
    # (Removed 'user: postgres' because Render doesn't allow 'postgres' as a username. Render will auto-generate one for you!)
